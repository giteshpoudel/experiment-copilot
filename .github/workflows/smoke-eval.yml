name: Smoke eval (paid)

# Calls the LLM API, so it runs only when triggered by hand. Needs the repository secret
# LLM_API_KEY (an OpenAI-compatible key; DeepSeek by default). Roughly $0.05 per run.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Dev scenarios to run"
        default: "4"

jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://api.deepseek.com
      LLM_MODEL: deepseek-v4-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Check the secret is set
        run: test -n "$LLM_API_KEY" || (echo "Add the LLM_API_KEY repository secret" && exit 1)
      - run: expc simulate --suite eval
      - run: expc eval --split dev --limit ${{ inputs.scenarios }} --runs 1 --configs agent,baseline --concurrency 4
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-eval
          path: evals/results/
