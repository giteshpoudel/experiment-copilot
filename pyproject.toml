[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expcopilot"
version = "0.1.0"
description = "An MCP server and agent for analyzing A/B tests, validated on simulated experiments with known truth."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "openai>=2.0,<3",
  "fastmcp>=4.1,<5",
  "numpy>=1.26",
  "pyarrow>=15",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
expc = "expcopilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/expcopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: simulation validation tests (deselect with -m 'not slow')",
  "live: calls the real LLM API and costs money (run with -m live)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
